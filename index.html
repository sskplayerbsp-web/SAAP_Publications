<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>

    <style>
        body{
            background: #0f0f0f;
            color: white;
            font-family: Arial;
            text-align: center;
            margin: 0;
        }

        .container{
            padding: 50px;
        }

        .logo{
            width: 220px;
            border-radius: 20px;
            box-shadow: 0 0 30px lime;
        }

        h1{
            font-size: 60px;
            color: lime;
        }

        p{
            font-size: 22px;
            color: #ccc;
        }

        .download-btn{
            display: inline-block;
            margin-top: 30px;
            padding: 18px 40px;
            font-size: 24px;
            background: lime;
            color: black;
            text-decoration: none;
            border-radius: 12px;
            transition: 0.3s;
        }

        .download-btn:hover{
            background: white;
            transform: scale(1.05);
        }

        /* SCOREBOARD */
        .scoreboard{
            margin: 40px auto;
            width: 320px;
            background: #1a1a1a;
            border: 2px solid lime;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,255,0,0.3);
        }

        .scoreboard h2{
            color: lime;
            margin-bottom: 15px;
        }

        .scoreboard p{
            margin: 8px 0;
            font-size: 18px;
            color: #ddd;
        }
    </style>
</head>
<body>

    <div class="container">

        <img src="logo.png" class="logo">

        <h1>SNAKE GAME</h1>

        <p>
            Play my custom Snake Game with cool effects and smooth gameplay!
        </p>

        <!-- SCOREBOARD -->
        <div class="scoreboard">
            <h2>🏆 TOP SCORES</h2>
            <p>Sleepy gamer844 ---- 2487</p>
            <p>Gang_god ----- 2432</p>
            <p>BMGO_GAMING6242 ---- 1984</p>
        </div>

        <a href="Snake_Game.zip" download class="download-btn">
            DOWNLOAD GAME
        </a>

    </div>

</body>
</html>
