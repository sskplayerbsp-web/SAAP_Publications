<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>

    <style>

        body{
            background: #0f0f0f;
            color: white;
            font-family: Arial;
            text-align: center;
            margin: 0;
        }

        .container{
            padding: 50px;
        }

        .logo{
            width: 220px;
            border-radius: 20px;
            box-shadow: 0 0 30px lime;
        }

        h1{
            font-size: 60px;
            color: lime;
            text-shadow: 0 0 15px lime;
        }

        p{
            font-size: 22px;
            color: #ccc;
        }

        .download-btn{
            display: inline-block;
            margin-top: 30px;
            padding: 18px 40px;
            font-size: 24px;
            background: lime;
            color: black;
            text-decoration: none;
            border-radius: 12px;
            transition: 0.3s;
            font-weight: bold;
        }

        .download-btn:hover{
            background: white;
            transform: scale(1.08);
            box-shadow: 0 0 20px lime;
        }

        /* LEADERBOARD */

        .scoreboard{
            margin: 45px auto;
            width: 380px;
            background: #111;
            border: 2px solid lime;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0,255,0,0.3);

            animation: floatBox 4s ease-in-out infinite;
        }

        .scoreboard h2{
            color: lime;
            margin-bottom: 20px;
            font-size: 30px;

            text-shadow: 0 0 10px lime;
            animation: glowText 2s infinite alternate;
        }

        .score-row{
            display: flex;
            justify-content: space-between;
            align-items: center;

            background: #1b1b1b;
            margin: 12px 0;
            padding: 12px 18px;

            border-radius: 10px;

            font-size: 18px;
            color: white;

            transition: 0.3s;

            opacity: 0;
            animation: slideIn 1s forwards;
        }

        .score-row:hover{
            transform: scale(1.05);
            background: rgba(0,255,0,0.15);

            box-shadow: 0 0 15px lime;
        }

        .score-row:nth-child(2){
            animation-delay: 0.2s;
        }

        .score-row:nth-child(3){
            animation-delay: 0.5s;
        }

        .score-row:nth-child(4){
            animation-delay: 0.8s;
        }

        /* ANIMATIONS */

        @keyframes glowText{
            from{
                text-shadow: 0 0 5px lime;
            }

            to{
                text-shadow: 0 0 20px lime;
            }
        }

        @keyframes floatBox{
            0%,100%{
                transform: translateY(0px);
            }

            50%{
                transform: translateY(-8px);
            }
        }

        @keyframes slideIn{
            from{
                opacity: 0;
                transform: translateX(-40px);
            }

            to{
                opacity: 1;
                transform: translateX(0);
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <img src="logo.png" class="logo">

        <h1>SNAKE GAME</h1>

        <p>
            Play my custom Snake Game with cool effects and smooth gameplay!
        </p>

        <!-- DOWNLOAD BUTTON -->

        <a href="Snake_Game.zip" download class="download-btn">
            DOWNLOAD GAME
        </a>

        <!-- ANIMATED LEADERBOARD -->

        <div class="scoreboard">

            <h2>🏆 TOP SCORES 🏆</h2>

            <div class="score-row">
                <span>#1 Sleepy gamer844</span>
                <span>3480</span>
            </div>

            <div class="score-row">
                <span>#2 Gang_god</span>
                <span>2432</span>
            </div>

            <div class="score-row">
                <span>#3 BMGO_GAMING6242</span>
                <span>1984</span>
            </div>

        </div>

    </div>

</body>
</html>
